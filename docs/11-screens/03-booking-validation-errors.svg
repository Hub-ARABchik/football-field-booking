="44" rx="10" fill="#176B45" opacity="1"/><text x="40" y="170" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start">Шарҳи умумӣ</text><text x="40" y="228" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start">Бандҳои ман</text><text x="40" y="284" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#C4D5C8" text-anchor="start">Майдончаҳои интихобшуда</text><text x="40" y="340" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="500" fill="#C4D5C8" text-anchor="start">Профил</text><line x1="24" y1="824" x2="226" y2="824" stroke="#365C46" stroke-width="1" opacity="1"/><text x="26" y="856" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#C4D5C8" text-anchor="start">Баромадан</text><text x="292" y="126" font-family="Noto Sans, Arial, sans-serif" font-size="28" font-weight="750" fill="#1F2937" text-anchor="start">Бронкунии нав</text><text x="292" y="158" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#526057" text-anchor="start">Бронкуниҳо ва ҳолати дархостҳои шумо дар як ҷо</text><rect x="292" y="194" width="1088" height="620" rx="16" fill="#FFFFFF" opacity="1" stroke="#CBD5CC" stroke-width="1"/><text x="322" y="238" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="750" fill="#1F2937" text-anchor="start">Маълумоти бронкунӣ</text><text x="322" y="286" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="650" fill="#526057" text-anchor="start">Майдонча</text><rect x="322" y="302" width="480" height="48" rx="9" fill="#FFFFFF" opacity="1" stroke="#CBD5CC" stroke-width="1"/><text x="340" y="332" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Arena Mercury</text><text x="836" y="286" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="650" fill="#526057" text-anchor="start">Санаи бозӣ</text><rect x="836" y="302" width="480" height="48" rx="9" fill="#FCEDEC" opacity="1" stroke="#B91C1C" stroke-width="1.5"/><text x="854" y="332" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">22.11.2026</text><text x="836" y="371" font-family="Noto Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="start">Ин санаро интихоб кардан мумкин нест — сана гузаштааст.</text><text x="322" y="408" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="650" fill="#526057" text-anchor="start">Вақт</text><rect x="322" y="424" width="480" height="48" rx="9" fill="#FFFFFF" opacity="1" stroke="#CBD5CC" stroke-width="1"/><text x="340" y="454" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">18:00–19:00</text><text x="836" y="408" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="650" fill="#526057" text-anchor="start">Усули пардохт</text><rect x="836" y="424" width="480" height="48" rx="9" fill="#FFFFFF" opacity="1" stroke="#CBD5CC" stroke-width="1"/><text x="854" y="454" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="start">Нақдӣ  ▾</text><text x="322" y="524" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="650" fill="#526057" text-anchor="start">Дастрасии вақт</text><rect x="322" y="542" width="480" height="62" rx="10" fill="#FFF5DE" opacity="1"/><circle cx="346" cy="573" r="10" fill="#92400E"/><text x="346" y="577" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="370" y="568" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start">Ин соат аллакай банд шудааст.</text><text x="370" y="589" font-family="Noto Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#92400E" text-anchor="start">Соати дигарро интихоб кунед ё ҷадвалро нав кунед.</text><rect x="836" y="542" width="480" height="62" rx="10" fill="#EAF5EC" opacity="1"/><circle cx="860" cy="573" r="10" fill="#166534"/><text x="860" y="577" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text><text x="884" y="568" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="start">Вақтҳои холӣ санҷида мешаванд.</text><text x="884" y="589" font-family="Noto Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#166534" text-anchor="start">Ҳангоми ирсол сервер дастрасиро боз месанҷад.</text><rect x="322" y="650" width="210" height="48" rx="10" fill="#176B45" opacity="1"/><text x="427" y="680" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="650" fill="#FFFFFF" text-anchor="middle">Аз нав санҷидан</text><rect x="548" y="650" width="170" height="48" rx="10" fill="#FFFFFF" opacity="1" stroke="#CBD5CC" stroke-width="1"/><text x="633" y="680" font-family="Noto Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2937" text-anchor="middle">Бозгаштан</text><rect x="292" y="740" width="1088" height="74" rx="12" fill="#EEF7D8" opacity="1"/><text x="320" y="772" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#123D2B" text-anchor="start">Эзоҳ:</text><text x="366" y="772" font-family="Noto Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#526057" text-anchor="start">Бронкунӣ танҳо баъди санҷиши сервер сабт мешавад. Як вақтро ду муштарӣ банд карда наметавонанд.</text><rect x="1050" y="115" width="330" height="44" rx="10" fill="#FCEDEC" opacity="1"/><circle cx="1074" cy="137" r="8" fill="#B91C1C"/><text x="1074" y="141" font-family="Noto Sans, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="1092" y="142" font-family="Noto Sans, Arial, sans-serif" font-size="11" font-weight="650" fill="#B91C1C" text-anchor="start">Лутфан хатогиҳоро ислоҳ кунед</text><text x="1350" y="860" font-family="Noto Sans, Arial, sans-serif" font-size="10" font-weight="650" fill="#526057" text-anchor="end">03  /  VALIDATION ERRORS</text></svg>